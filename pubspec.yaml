name: ping_med_app
description: "PingMed - a Flutter medication reminder app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  font_awesome_flutter: ^11.0.0
  lottie: ^3.1.3
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
